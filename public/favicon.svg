<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cockpit Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="60%" stop-color="#080d19"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Inner Border Line Gradient -->
    <linearGradient id="innerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Left Wing Gradient (Mint to Deep Emerald) -->
    <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Right Wing Gradient (Emerald to Electric Cyan) -->
    <linearGradient id="rightWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Ambient Center Glows -->
  <circle cx="256" cy="266" r="136" fill="#10b981" fill-opacity="0.16" filter="url(#softGlow)"/>
  <circle cx="315" cy="215" r="105" fill="#06b6d4" fill-opacity="0.14" filter="url(#softGlow)"/>

  <!-- Border Rings -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#borderGrad)" stroke-width="6" fill="none"/>
  <rect x="21" y="21" width="470" height="470" rx="107" stroke="url(#innerBorderGrad)" stroke-width="1.5" fill="none"/>

  <!-- Left Wing of V (Emerald Faceted Blade) -->
  <polygon points="118,138 196,138 266,336 256,396 220,396 118,182" fill="url(#leftWingGrad)"/>
  <!-- Left Inner Facet Specular Highlight -->
  <polygon points="154,138 196,138 266,336 236,336" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Right Wing of V (Electric Flow Stream) -->
  <polygon points="242,396 278,396 394,182 394,138 316,138 246,336" fill="url(#rightWingGrad)"/>
  <!-- Right Inner Facet Specular Highlight -->
  <polygon points="316,138 358,138 278,336 246,336" fill="#ffffff" fill-opacity="0.16"/>

  <!-- Top-Right Broadcast Pulse Beacon -->
  <circle cx="394" cy="138" r="30" fill="#38bdf8" fill-opacity="0.32" filter="url(#neonPulse)"/>
  <circle cx="394" cy="138" r="16" fill="#38bdf8"/>
  <circle cx="394" cy="138" r="10" fill="#10b981"/>
  <circle cx="394" cy="138" r="5" fill="#ffffff"/>

  <!-- Bottom Apex Pulse Node (Heartbeat) -->
  <circle cx="254" cy="394" r="18" fill="#34d399" fill-opacity="0.5" filter="url(#neonPulse)"/>
  <circle cx="254" cy="394" r="5" fill="#ffffff"/>
</svg>
